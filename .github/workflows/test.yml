name: Test
on: [push]
jobs:
  runTests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # lockfiles are not commited, so autodetection will not work, need to specify bundler version
        include:
          - ruby-version: 2.4
            rails-version: 50_rspec
            bundler-version: default
          - ruby-version: 2.6
            rails-version: 50_simplecov
            bundler-version: default
          - ruby-version: 2.7
            rails-version: 6
            bundler-version: default
          - ruby-version: 3.1
            rails-version: 7
            bundler-version: default
          - ruby-version: 4.0
            rails-version: 8
            bundler-version: default
    continue-on-error: ${{ matrix.ruby-version == '1.9' }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails-version }}.gemfile

    steps:
      - uses: actions/checkout@master
      - name: Disable broken ssl for legacy ruby
        run: |
          echo :ssl_verify_mode: 0 >> ~/.gemrc
          echo gem: --no-ri --no-rdoc >> ~/.gemrc
          echo "RUBYGEMS_HOST=http://rubygems.org" >> $GITHUB_ENV
        if: matrix.ruby-version == '1.9'
      - name: Install ruby
        uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          bundler: ${{ matrix.bundler-version }}

      - name: Run tests
        run: |
          bundle exec rake spec
